<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 716" role="img" aria-label="Follow the claim. Six questions asked of the agent's sentence 'Tests pass': what it said, what it rests on, which version it ran on, what changed since, whether anything re-checked it, and what we actually know. Proof stops at step four, where checkout/api.py changed after the run. A re-check on the current version passes and the claim reads Proven.">
